<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>음원 확인</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#FFFDF9;color:#2A2229;font-family:'Noto Sans KR',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 96px}
h1{font-family:'Jua',sans-serif;font-weight:400;font-size:36px;margin:0}
p{color:#6B6168;margin:6px 0 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid #2A2229;outline-offset:2px}
.all{width:100%;min-height:60px;margin-top:16px;border-radius:18px;background:#2A2229;color:#fff;font-family:'Jua',sans-serif;font-size:24px}
section{margin-top:22px;border:3px solid var(--b);border-radius:24px;padding:14px;background:#fff}
.head{display:flex;align-items:center;gap:12px}
.letter{font-family:'Fredoka',sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--c);width:40px;text-align:center}
.full{flex:1;min-height:52px;border-radius:14px;background:var(--c);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.clip{min-height:52px;border-radius:14px;background:var(--t);font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;border:3px solid transparent}
.on{border:3px solid #2A2229!important}
.bar{position:fixed;left:0;right:0;bottom:0;background:#2A2229;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:16px}
.bar button{color:#fff;background:#6B6168;border-radius:10px;padding:8px 14px;min-height:40px}
</style>
</head>
<body>
<main>
<h1>음원 확인</h1>
<p>칸을 누르면 하나씩, 아래 버튼을 누르면 이어서 들을 수 있어요.</p>
<button class="all" id="all">단어와 소리 전부 이어 듣기</button>
<div id="list"></div>
</main>
<div class="bar"><span id="now" role="status">대기 중</span><button id="stop">멈추기</button></div>
<script>
const DATA={"a":[{"w":"sound","f":"a-sound.m4a","s":1.04,"e":1.58},{"w":"apple","f":"a-apple.m4a","s":4.78,"e":5.58},{"w":"ax","f":"a-ax.m4a","s":6.74,"e":7.62},{"w":"add","f":"a-add.m4a","s":8.94,"e":9.72},{"w":"ask","f":"a-ask.m4a","s":11.02,"e":11.88},{"w":"at","f":"a-at.m4a","s":13.04,"e":13.82}],"e":[{"w":"sound","f":"e-sound.m4a","s":1.54,"e":2.02},{"w":"egg","f":"e-egg.m4a","s":5.86,"e":6.5},{"w":"elf","f":"e-elf.m4a","s":8.06,"e":8.84},{"w":"edge","f":"e-edge.m4a","s":10.42,"e":11.04},{"w":"elbow","f":"e-elbow.m4a","s":12.54,"e":13.44},{"w":"exit","f":"e-exit.m4a","s":14.7,"e":15.38}],"i":[{"w":"sound","f":"i-sound.m4a","s":1.32,"e":1.64},{"w":"igloo","f":"i-igloo.m4a","s":5.72,"e":6.52},{"w":"it","f":"i-it.m4a","s":7.96,"e":8.54},{"w":"is","f":"i-is.m4a","s":10.1,"e":10.82},{"w":"if","f":"i-if.m4a","s":12.32,"e":13.02},{"w":"itch","f":"i-itch.m4a","s":14.56,"e":15.26}],"o":[{"w":"sound","f":"o-sound.m4a","s":1.68,"e":2.18},{"w":"octopus","f":"o-octopus.m4a","s":6.24,"e":7.36},{"w":"ox","f":"o-ox.m4a","s":8.62,"e":9.6},{"w":"odd","f":"o-odd.m4a","s":10.88,"e":11.72},{"w":"otter","f":"o-otter.m4a","s":13.16,"e":13.84},{"w":"olive","f":"o-olive.m4a","s":15.44,"e":16.3}],"u":[{"w":"sound","f":"u-sound.m4a","s":1.94,"e":2.32},{"w":"umbrella","f":"u-umbrella.m4a","s":6.24,"e":7.08},{"w":"up","f":"u-up.m4a","s":8.76,"e":9.4},{"w":"us","f":"u-us.m4a","s":10.86,"e":11.6},{"w":"upset","f":"u-upset.m4a","s":13.0,"e":13.9},{"w":"upper","f":"u-upper.m4a","s":15.56,"e":16.18}]};
const COLORS={a:['#D63A7A','#FCE8F0','#F3C6D8'],e:['#C25E00','#FDEEDD','#F5D2AE'],i:['#1F8A4C','#E3F4EA','#B9E2C8'],o:['#2470D0','#E4EEFB','#BCD3F2'],u:['#7444C2','#EFE8FA','#D3C3EF']};
const audio=new Audio();let queue=[],btn=null;
const $=id=>document.getElementById(id);
function play(item){if(btn)btn.classList.remove('on');btn=item.b;btn.classList.add('on');$('now').textContent=item.name+' 재생 중';audio.src='audio/'+item.f+'?v=2';audio.play().catch(()=>{$('now').textContent='다시 눌러 주세요';});}
function clear(){queue=[];audio.pause();if(btn)btn.classList.remove('on');btn=null;$('now').textContent='대기 중';}
const items={};
Object.keys(DATA).forEach(v=>{
  const s=document.createElement('section'),c=COLORS[v];s.style.setProperty('--c',c[0]);s.style.setProperty('--t',c[1]);s.style.setProperty('--b',c[2]);
  const head=document.createElement('div');head.className='head';
  const l=document.createElement('div');l.className='letter';l.textContent=v;
  const full=document.createElement('button');full.className='full';full.textContent='큰 버튼 녹음 전체';
  full.onclick=()=>{clear();play({f:v+'.m4a',b:full,name:v+' 전체'});};
  head.append(l,full);s.append(head);
  const g=document.createElement('div');g.className='grid';items[v]=[];
  DATA[v].forEach(x=>{const b=document.createElement('button');b.className='clip';const name=x.w==='sound'?'/'+v+'/':x.w;b.textContent=name;
    const it={f:x.f,b,name};items[v].push(it);b.onclick=()=>{clear();play(it);};g.append(b);});
  s.append(g);$('list').append(s);
});
$('all').onclick=()=>{clear();queue=Object.values(items).flat();play(queue.shift());};
$('stop').onclick=clear;
audio.addEventListener('ended',()=>{if(queue.length){setTimeout(()=>{if(queue.length)play(queue.shift());},500);}else{if(btn)btn.classList.remove('on');btn=null;$('now').textContent='대기 중';}});
audio.addEventListener('error',()=>{if(audio.getAttribute('src'))$('now').textContent='불러오지 못한 파일이 있어요';});
</script>
</body>
</html>
